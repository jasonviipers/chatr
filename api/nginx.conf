upstream apiUpstream {

  # 1. Set your port here
  # If you didn't change it from .env, you can
  # ignore it and keep the default port 8080
  server 127.0.0.1:8080;
  keepalive 64;
}

server {
  listen 80;
  listen 443 ssl;

  # 2. Set your API domain name here
  server_name yourdomain.com;

  location / {
    # Set TRUST_PROXY=true in the API's .env when this proxy is in front of it. The API takes the LAST
    # entry of this header, so whatever the client sent can never pose as its address. Behind a CDN, add
    # `set_real_ip_from <cdn ranges>; real_ip_header CF-Connecting-IP;` (or your CDN's header) so that
    # $remote_addr is the visitor and not the CDN.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $http_host;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_pass http://apiUpstream/;
    proxy_redirect off;
    proxy_read_timeout 240s;
  }

  # 3. SSL certificate set below
  # Here is added a sample certificate format of letsencrypt
  # You are free to remove it and configure yours here
  ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
