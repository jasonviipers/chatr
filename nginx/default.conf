upstream app {
    server app:3000;
}

upstream api {
    server api:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # The dev server (Vite) opens its HMR websocket on the same path
    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # REST, the realtime socket (/api/socket) and the WebRTC signalling (/api/peer) all go through here
    location /api {
        rewrite /api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # overwritten, not appended: the API trusts this header when TRUST_PROXY=true, so a client must not be able to forge it
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # sockets stay open for the whole meeting; the clients ping every few seconds, so a silent one is really dead
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
